version: 2
updates:
  # SHA で固定した action を最新へ追従させるための PR を出させる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: development
