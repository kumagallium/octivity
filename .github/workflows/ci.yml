name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定では何も渡さず、必要な権限だけ job 単位で足す
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # サードパーティ／外部 action はタグではなく commit SHA で固定する。
      # タグは上書きできるため、固定しないと成果物に任意コードを混ぜられる。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # lockfile 不一致で落とし、依存の postinstall も走らせない
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
